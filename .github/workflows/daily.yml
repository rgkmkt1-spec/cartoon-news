name: Daily episode

on:
  schedule:
    # GitHub drops/delays scheduled runs at busy times (especially :00), so use odd minutes
    # and a backup trigger. Times are UTC:
    #   09:23 UTC = 4:23 AM Eastern (standard time) / 5:23 AM (daylight time)  <- main run
    #   10:47 UTC = 5:47 AM / 6:47 AM                                           <- backup (skips if today's episode exists)
    - cron: "23 9 * * *"
    - cron: "47 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: full
        options: [full, script-only, sample]

concurrency:
  group: daily-episode
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.done.outputs.skip }}
    steps:
      - name: Skip backup run if today's episode already succeeded
        id: done
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          TODAY=$(date -u +%Y-%m-%d)
          N=$(gh run list -R "${{ github.repository }}" --workflow daily.yml --status success --limit 20 --json createdAt,event \
              --jq "[.[] | select(.createdAt >= \"$TODAY\")] | length")
          echo "successful runs today: $N"
          if [ "$N" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  episode:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache voice model + lip-sync tool
        uses: actions/cache@v4
        with:
          path: .cache
          key: assets-${{ runner.os }}-${{ hashFiles('scripts/setup.ts') }}

      - name: Install
        run: |
          npm ci
          pip install -r requirements.txt
          npm run setup

      - name: Make episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          YOUTUBE_MODE: ${{ vars.YOUTUBE_MODE || 'off' }}
          REVIEW_WINDOW_HOURS: ${{ vars.REVIEW_WINDOW_HOURS || '2' }}
          SOUND_FX: ${{ vars.SOUND_FX || 'on' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          if [ "$MODE" = "script-only" ]; then npm run daily -- --script-only
          elif [ "$MODE" = "sample" ]; then npm run daily -- --sample --no-upload
          else npm run daily
          fi

      - name: Save video for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            out/*/episode.mp4
            out/*/thumbnail.png
            out/*/script.txt
            out/*/description.txt
            out/*/script.json
